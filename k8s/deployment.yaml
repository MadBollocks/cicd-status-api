apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-status-api
  labels:
    app: cicd-status-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-status-api
  template:
    metadata:
      labels:
        app: cicd-status-api
    spec:
      containers:
        - name: cicd-status-api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
